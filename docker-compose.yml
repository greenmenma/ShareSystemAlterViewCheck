# デバッグ用：検証用 SQL Server を Docker で起動する（Aspire を使わず Server 単体で起動する場合）
#   起動: docker compose up -d
#   停止: docker compose down        （データも消す場合は docker compose down -v）
# Server の appsettings.Development.json の接続文字列（localhost,14330 / sa）と合わせてある
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sharesystemalterviewcheck-sql
    # Apple Silicon でも動くよう x64 イメージを指定（エミュレーション）
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Verify!Passw0rd}"
    ports:
      - "14330:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
